[project]
name = "index-tts-voice-app"
version = "0.4.5"
description = "Standalone local API, Windows desktop client, and VB-CABLE router for IndexTTS 2.5"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "requests>=2.28",
  "scipy>=1.15,<2",
  "sounddevice>=0.5,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.7,<7",
]
test = [
  "httpx2",
  "pytest>=7",
  "ruff>=0.11",
]

[project.scripts]
index-tts-voice-app = "voice_app.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
